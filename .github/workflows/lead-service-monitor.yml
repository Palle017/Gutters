# Public API health/reachability check only.
# Runs hourly (and on demand) from a GitHub-hosted runner outside the tailnet and
# calls the public /healthz route of the Gutters request service. It shows only
# whether that route answers with the expected health JSON. It does not test
# durable request saving, photo upload, browser CORS or the website's fallback
# behavior, and it is not proof that a customer request can or cannot be saved.
# A failed run is visible in the Actions tab; whether anyone is notified depends
# on each person's GitHub notification settings. No secrets, customer data or
# writes are involved, and response bodies are never printed. GitHub may disable
# schedules after 60 days without repository activity.
name: Public API health check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-service-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public API health route
        timeout-minutes: 3
        env:
          HEALTH_URL: https://serv2-linux.tail68bd87.ts.net:8443/healthz
        run: |
          set -u
          body_file="$(mktemp)"
          for attempt in 1 2 3; do
            status="$(curl -sS --max-time 15 --connect-timeout 10 -o "$body_file" -w '%{http_code}' "$HEALTH_URL" 2>/dev/null || echo 000)"
            if [ "$status" = "200" ] && python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("ok") is True and d.get("service")=="gutters-messaging" and d.get("storage")=="sqlite" else 1)' "$body_file" 2>/dev/null; then
              echo "Attempt $attempt: health route reachable and returned the expected health fields."
              exit 0
            fi
            echo "Attempt $attempt: health route check failed (HTTP status $status)."
            [ "$attempt" -lt 3 ] && sleep 30
          done
          echo "::error::Public API health route did not return the expected health response after 3 attempts."
          exit 1
